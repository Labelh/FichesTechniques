name: Build & Push GHCR

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: 'build-push'
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: neode-cedric/app-ft-shadow

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # nécessaire pour push GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=app-ft-shadow
            org.opencontainers.image.description=Fiches Techniques Ajust82 — VPS Shadow Néode
            org.opencontainers.image.vendor=Néode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_FIREBASE_API_KEY=AIzaSyDmnjA7AFMiLEyzYYD1m1Tg1UAioh-Xxjg
            VITE_FIREBASE_AUTH_DOMAIN=fichestechniques-cd97c.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=fichestechniques-cd97c
            VITE_FIREBASE_STORAGE_BUCKET=fichestechniques-cd97c.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=479197498353
            VITE_FIREBASE_APP_ID=1:479197498353:web:6463d33fe429df8c3f5250
            VITE_FIREBASE_MEASUREMENT_ID=G-98QERTYMZ9
            VITE_REFERENTIEL_ORIGIN=https://shadow.ajust82.fr
            VITE_REFERENTIEL_UPLOAD_TOKEN=${{ secrets.VITE_REFERENTIEL_UPLOAD_TOKEN }}
            VITE_GSTOCK_API=https://gstock.shadow.ajust82.fr

      - name: Image digest
        run: echo "Image poussée → ${{ steps.meta.outputs.tags }}"
